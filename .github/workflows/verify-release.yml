name: Verify Karakeep Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v0.34.1
permissions:
  contents: read
concurrency:
  group: karakeep-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.karakeep-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.karakeep', info['package']
              assert info['name'] == 'Karakeep', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'AGPL-3.0', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              m = yaml.safe_load(package.extractfile('manifest.yml').read())
              app = m['application']
              assert app['subdomain'] == 'karakeep', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and u['backend'] == 'http://web:3000/' for u in ups), ups
              # internal services must not be exposed
              for u in ups:
                  b = u.get('backend') or ''
                  assert 'meilisearch:' not in b and 'chrome:' not in b, b

              svcs = m['services']
              assert set(svcs) == {'web', 'chrome', 'meilisearch'}, set(svcs)

              web = svcs['web']
              # ghcr is required here: this image is not published on Docker Hub
              assert web['image'].startswith('ghcr.1ms.run/karakeep-app/karakeep:'), web['image']
              assert web['image'].endswith(':' + tag.lstrip('v')), web['image']

              env = ' '.join(web['environment'])
              assert 'DATA_DIR=/data' in env, env
              assert 'MEILI_ADDR=http://meilisearch:7700' in env, env
              assert 'MEILI_MASTER_KEY=' in env, env
              # without the browser, saved pages keep only raw HTML and reader view breaks
              assert 'BROWSER_WEB_URL=http://chrome:9222' in env, env
              # login callbacks are absolute; must be the public https domain
              assert 'NEXTAUTH_URL=https://' in env, env
              assert 'NEXTAUTH_SECRET=' in env, env
              assert 'stable_secret' in env, env

              assert any(b.endswith(':/data') for b in web['binds']), web['binds']

              chrome = svcs['chrome']
              assert chrome['image'].startswith('ghcr.1ms.run/karakeep-app/karakeep-chrome:'), chrome['image']

              meili = svcs['meilisearch']
              assert 'getmeili/meilisearch' in meili['image'], meili['image']
              assert 'healthcheck' in meili
              assert any(b.endswith(':/meili_data') for b in meili['binds']), meili['binds']

              # account is created by first-run self signup, so no admin deploy params
              assert 'deploy_params.yml' not in members, members

              assert 'healthcheck' not in web, web
              text = package.extractfile('manifest.yml').read().decode()
              assert 'lzc-file-chooser' not in text

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
              assert 'GNU AFFERO GENERAL PUBLIC LICENSE' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
